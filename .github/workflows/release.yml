name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.TARGET }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: aarch64-unknown-linux-musl
            MUSL_URI: aarch64-linux-musl-cross
            LINKER: aarch64-linux-musl-gcc
          - TARGET: armv7-unknown-linux-musleabihf
            MUSL_URI: armv7l-linux-musleabihf-cross
            LINKER: armv7l-linux-musleabihf-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: build-cargo-registry-${{ matrix.TARGET }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libc6-dev-i386 crossbuild-essential-arm64 crossbuild-essential-armhf musl-tools libboost-all-dev libc6-dev
          
          # Install musl-cross toolchain
          mkdir -p /opt/musl_gcc
          wget -c https://github.com/rustp2p/musl-cross/releases/download/0.0.1/${{ matrix.MUSL_URI }}.tgz -P /opt/musl_gcc/
          tar zxf /opt/musl_gcc/${{ matrix.MUSL_URI }}.tgz -C /opt/musl_gcc/
          sudo ln -sf /opt/musl_gcc/${{ matrix.MUSL_URI }}/bin/*gcc /usr/bin/

      - name: Configure Cargo target
        run: |
          mkdir -p ~/.cargo
          cat >>~/.cargo/config.toml <<EOF
          [target.${{ matrix.TARGET }}]
          linker = "${{ matrix.LINKER }}"
          rustflags = ["-C", "target-feature=+crt-static", "-C", "strip=symbols"]
          EOF

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.TARGET }}

      - name: Build Workspace
        run: |
          cargo build --workspace --release --all-features --verbose --target ${{ matrix.TARGET }}

      - name: Prepare Binaries
        run: |
          mkdir -p ./artifacts/${{ matrix.TARGET }}
          cp ./target/${{ matrix.TARGET }}/release/vnt2_cli ./artifacts/${{ matrix.TARGET }}/
          cp ./target/${{ matrix.TARGET }}/release/vnt2_ctrl ./artifacts/${{ matrix.TARGET }}/
          cp ./target/${{ matrix.TARGET }}/release/vnts2 ./artifacts/${{ matrix.TARGET }}/

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.TARGET }}
          path: ./artifacts/${{ matrix.TARGET }}/*

  package-plugin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Package Merlin Plugin
        run: |
          # Copy files to a temporary packaging directory
          mkdir -p dist/vnt/scripts dist/vnt/webs dist/vnt/res dist/vnt/bin
          cp -rf merlin_plugin/. dist/vnt/
          
          # Clean up any potential backups from temporary packaging dir
          rm -f dist/vnt/scripts/*.bak
          rm -f dist/vnt/webs/*.bak
          
          # Bundle the compiled binaries into the plugin folder
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnt2_cli dist/vnt/bin/vnt2_cli_aarch64
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnt2_ctrl dist/vnt/bin/vnt2_ctrl_aarch64
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnts2 dist/vnt/bin/vnts2_aarch64
          
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnt2_cli dist/vnt/bin/vnt2_cli_arm
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnt2_ctrl dist/vnt/bin/vnt2_ctrl_arm
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnts2 dist/vnt/bin/vnts2_arm
          
          # Create architecture-specific binary tarballs for client and server (optional standalone releases)
          mkdir -p binary_releases
          
          # aarch64 client package
          mkdir -p temp_client_aarch64
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnt2_cli temp_client_aarch64/
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnt2_ctrl temp_client_aarch64/
          tar -zcvf binary_releases/vnt2-client-aarch64.tar.gz -C temp_client_aarch64 vnt2_cli vnt2_ctrl
          
          # armv7 client package
          mkdir -p temp_client_armv7
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnt2_cli temp_client_armv7/
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnt2_ctrl temp_client_armv7/
          tar -zcvf binary_releases/vnt2-client-armv7.tar.gz -C temp_client_armv7 vnt2_cli vnt2_ctrl

          # aarch64 server package
          mkdir -p temp_server_aarch64
          cp ./downloaded-artifacts/binaries-aarch64-unknown-linux-musl/vnts2 temp_server_aarch64/
          tar -zcvf binary_releases/vnts2-server-aarch64.tar.gz -C temp_server_aarch64 vnts2

          # armv7 server package
          mkdir -p temp_server_armv7
          cp ./downloaded-artifacts/binaries-armv7-unknown-linux-musleabihf/vnts2 temp_server_armv7/
          tar -zcvf binary_releases/vnts2-server-armv7.tar.gz -C temp_server_armv7 vnts2

          # Package the main Merlin plugin installation package (now contains bin/)
          cd dist
          tar -zcvf ../vnt-koolshare.tar.gz vnt/
          cd ..
          
          # Prepare all files for GitHub Release
          mkdir -p release_files
          mv vnt-koolshare.tar.gz release_files/
          mv binary_releases/* release_files/

      - name: Archive release package
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release_files/*

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: ./release-artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
